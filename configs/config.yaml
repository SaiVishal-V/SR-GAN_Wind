# ==============================================================================
# SR-GAN Wind Speed Super-Resolution — Configuration (V2)
# ==============================================================================

# --- Data Paths ---
data:
  local_path: "E:/SR-GAN/IR_wind_23_24_new_SRGAN_ready.nc"
  colab_path: "/content/IR_wind_23_24_new_SRGAN_ready.nc"
  lr_variable: "wind_speed_lr_norm"
  hr_variable: "wind_speed_hr_norm"
  mask_variable: "hr_ocean_mask"
  quality_variable: "lr_ocean_fraction"
  norm_mean: 6.336302810300043
  norm_std: 2.9275431488456434
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  cache_dataset: true

# --- Patch Extraction ---
patches:
  lr_patch_size: 16
  hr_patch_size: 64
  min_ocean_fraction: 0.5
  patches_per_image: 32

# --- Model Architecture ---
model:
  scale_factor: 4
  in_channels: 1
  generator:
    num_features: 64
    num_residual_blocks: 8
    use_batchnorm: false
    activation: "prelu"
  discriminator:
    type: "patchgan"
    base_channels: 64
    spectral_norm: true
    use_instance_norm: true    # V2: configurable (E8: set false)

# --- Loss Functions ---
loss:
  pixel_weight: 1.0
  adversarial_weight: 0.001
  gradient_weight: 0.1
  laplacian_weight: 0.0        # V2: E3 ablation sets 0.05
  spectral_weight: 0.0         # V2: E5 ablation sets 0.001
  charbonnier_weight: 0.0      # V2: E6 ablation
  multiscale_weight: 0.0       # V2: future
  pixel_loss_type: "l1"        # l1 | charbonnier

# --- Training ---
training:
  pretrain_epochs: 100
  gan_epochs: 200
  batch_size: 16
  num_workers: 4
  optimizer:
    type: "adamw"
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
  scheduler:
    type: "cosine"             # cosine | warm_restarts | onecycle
    T_max: null
    eta_min: 0.000001
    T_0: 50                    # warm_restarts period
    T_mult: 2                  # warm_restarts multiplier
  gradient_clip: 1.0
  amp: true
  early_stopping:
    enabled: true
    patience: 30
    metric: "val_rmse"
    mode: "min"
    min_delta: 0.0005

# --- Optimization V2 ---
optimization:
  ema_enabled: true
  ema_decay: 0.999
  swa_enabled: false
  swa_start_epoch: 150
  swa_lr: 0.00001
  track_gradients: true

# --- Experiment ---
experiment:
  name: "baseline_v1"
  wandb_enabled: false
  wandb_project: "srgan-wind"

# --- Checkpointing ---
checkpoint:
  save_dir: "checkpoints"
  save_interval: 50
  save_best_rmse: true
  save_best_ssim: true
  save_best_psnr: true

# --- Logging ---
logging:
  tensorboard: true
  tensorboard_dir: "tensorboard"
  log_interval: 10

# --- Evaluation ---
evaluation:
  output_dir: "outputs"
  vmin: 0
  vmax: 30
  cmap: "viridis"
  missing_color: "white"

# --- Reproducibility ---
seed: 42
deterministic: true
